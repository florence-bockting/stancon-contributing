project:
  type: book
  output-dir: _book

book:
  title: "Contributing to Stan"
  subtitle: "A Developer’s Guide to the Core, Interfaces, and First Contributions"
  author: "Florence Bockting"
  date: today
  chapters:
    - index.qmd
    - 01-what-is-stan.qmd
    - 02-how-to-contribute.qmd
    - 03-find-information.qmd
    - 05-checklist.qmd

format:
  html:
    toc: true
    number-sections: true
    embed-resources: true
    code-fold: false
    css: book.css

execute:
  echo: true
  eval: true
  freeze: auto
